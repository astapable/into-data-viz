<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02 - D3 Stacked Bar Chart Demo</title>
    <link href="style.css" rel="stylesheet">
    <script defer src="https://d3js.org/d3.v7.min.js"></script>
    <script defer src="./bar_stacked.js"></script>
</head>
<body>
    <section>
        <div class="container">
            <header>
                <div class="wrapper">
                    <h1>Weekly Viewing by Content Type</h1>
                    <div class="sizer">
                        <p>The chart illustrates how total viewing changes week to week and how each category contributes to the overall volume.</p>
                    </div>
                </div>
                <div id="legend"></div>
            </header>
            <!-- Chart container for D3 visualization -->
            <div id="chart"></div>
            
            <!-- <div class="note">
                <strong>Code Reference:</strong> See <code>bar_stacked.js</code> for D3 stacking methods, data transformations, and datetime parsing.<br>
                <strong>Note:</strong> This example uses only core D3 and includes a small in-SVG legend.
            </div> -->
        </div>
    </section>
</body>
</html>

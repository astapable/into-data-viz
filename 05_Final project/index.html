<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Global High-Technology Exports</title>
        <link rel="stylesheet" href="./style.css"/>
        <script defer src="https://unpkg.com/d3"></script>
        <script defer type="module" src="./app.js"></script>
    </head>
    <body>
        <main id="wrapper">
            <section id="sidebar">
                <section class="sidebar-card">
                    <header id="sidebar-header">
                        <div id="title-row">
                            <h1 id="sidebar-title">Global High-Tech Exports</h1>
                            <a href="https://data.worldbank.org/indicator/TX.VAL.TECH.MF.ZS" target="_blank" id="source-link" aria-label="Source: World Bank">
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2 10L10 2M10 2H5M10 2V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                        </div>
                        <p id="sidebar-subtitle">High-tech export specialization is uneven across the world, with only a limited group of countries showing a high share of advanced manufacturing exports.</p>
                    </header>
                    <ul>
                        <li class="dropdown-wrapper">
                            <div class="select-wrapper">
                                <select id="year-select"></select>
                            </div> 
                        </li>
                        <li class="dropdown-wrapper">
                            <div class="select-wrapper">
                                <select id="region-select">
                                    <option value="">All regions</option>
                                    <option>North America</option>
                                    <option>Central America</option>
                                    <option>South America</option>
                                    <option>Europe</option>
                                    <option>Middle East</option>
                                    <option>Central Asia</option>
                                    <option>South Asia</option>
                                    <option>East Asia</option>
                                    <option>Southeast Asia</option>
                                    <option>Africa</option>
                                    <option>Oceania</option>
                                </select>
                            </div>
                        </li>
                        <li class="dropdown-wrapper">
                            <div class="select-wrapper">
                                <select id="country-select">
                                    <option value="">All countries</option>
                                </select>
                            </div>
                        </li>
                    </ul>
                     <div class="detail-chart">
                         <div id="panel">
                             <p id="info-desc">Click a country to see its value.</p>
                         </div>
                     </div>
                </section>
            </section>
            <section id="map">
                <div id="controls">
                    <button id="zoom-in" aria-label="Zoom in">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button id="zoom-out" aria-label="Zoom out">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 8H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button id="reset" aria-label="Reset view">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 8A5 5 0 1 0 4.5 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M3 2.5V5H5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <div id="legend-box">
                    <div id="legend"></div>
                </div>
            </section>
            <div id="tooltip"></div>
        </main>
    </body>
</html>

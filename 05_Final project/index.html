<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EU High-Technology Exports</title>
        <link rel="stylesheet" href="./style.css"/>
        <script defer src="https://unpkg.com/d3"></script>
        <script defer type="module" src="./app.js"></script>
    </head>
    <body>
        <main id="wrapper">
            <aside id="sidebar">
                <div class="sidebar-card">
                    <div id="sidebar-header">
                        <h1 id="sidebar-title">EU High-Tech Exports</h1>
                        <p id="sidebar-subtitle">The share of high-technology products within each EU country's total exports.</p>
                        <div id="source-row">
                            <span id="source-label">Source: Eurostat</span>
                            <a href="https://ec.europa.eu/eurostat/databrowser/view/htec_si_exp4" target="_blank" id="source-link" aria-label="Source">
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2 10L10 2M10 2H5M10 2V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <p class="section-label">Year</p>
                    <div class="select-wrapper">
                        <select id="year-select"></select>
                    </div>

                    <div class="divider"></div>

                    <p class="section-label">Country</p>
                    <div class="select-wrapper">
                        <select id="country-select">
                            <option value="">All countries</option>
                        </select>
                    </div>

                    <div class="divider"></div>

                    <div id="panel">
                        <p id="info-desc">Click a country to see its breakdown by product group.</p>
                    </div>
                </div>
            </aside>
            <div id="map">
                <div id="controls">
                    <button id="zoom-in">+</button>
                    <button id="zoom-out">−</button>
                    <button id="reset">↺</button>
                </div>
                <div id="legend-box">
                    <div id="legend"></div>
                </div>
            </div>
            <div id="tooltip"></div>
        </main>
    </body>
</html>
